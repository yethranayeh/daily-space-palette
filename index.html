    <script>
      try {
        (function () {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            window.__themeInit = t;
          } else {
            window.__themeInit = window.matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.toggle("light", window.__themeInit === "light");
          document.documentElement.classList.toggle("dark", window.__themeInit === "dark");
        })();
      } catch {
        window.__themeInit = "dark";
      }
    </script>
